version: '3.8'

services:
  backend:
    build: 
      context: .
      dockerfile: Dockerfile
    container_name: athena_backend
    restart: always
    env_file:
      - .env
    environment:
      - REDIS_URL=${REDIS_URL:-redis://redis:6379}
      - DATABASE_URL=${DATABASE_URL:-postgresql://athena:athena_secure_password@postgres:5432/athena_db}
      - QDRANT_URL=${QDRANT_URL:-http://qdrant:6333}
      - ANONYMIZED_TELEMETRY=false
      - CHROMA_SERVER_NOFILE=65535
      - OLLAMA_HOST=${OLLAMA_HOST:-http://host.docker.internal:11434}
      - OLLAMA_BASE_URL=${OLLAMA_BASE_URL:-http://host.docker.internal:11434}
      - OLLAMA_MODEL=${OLLAMA_MODEL:-llama3.2}
    extra_hosts:
      - "host.docker.internal:host-gateway"
    volumes:
      - ./app:/app/app
      - chroma_data:/app/storage
      - ./data:/app/data
    networks:
      - athena_network
    depends_on:
      - redis
      - postgres
      - qdrant

  worker:
    build: 
      context: .
      dockerfile: Dockerfile
    container_name: athena_worker
    restart: always
    env_file:
      - .env
    environment:
      - REDIS_URL=${REDIS_URL:-redis://redis:6379}
      - DATABASE_URL=${DATABASE_URL:-postgresql://athena:athena_secure_password@postgres:5432/athena_db}
      - QDRANT_URL=${QDRANT_URL:-http://qdrant:6333}
      - OLLAMA_HOST=${OLLAMA_HOST:-http://host.docker.internal:11434}
      - OLLAMA_BASE_URL=${OLLAMA_BASE_URL:-http://host.docker.internal:11434}
      - OLLAMA_MODEL=${OLLAMA_MODEL:-llama3.2}
    extra_hosts:
      - "host.docker.internal:host-gateway"
    volumes:
      - ./app:/app/app
      - chroma_data:/app/storage
      - ./data:/app/data
    command: celery -A app.core.celery_app worker --loglevel=info
    networks:
      - athena_network
    depends_on:
      - redis
      - postgres
      - qdrant

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: athena_frontend
    restart: always
    networks:
      - athena_network

  caddy:
    image: caddy:2-alpine
    container_name: athena_caddy
    restart: always
    ports:
      - "80:80"
      - "443:443"
    environment:
      - DOMAIN_NAME=${DOMAIN_NAME:-localhost}
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
    networks:
      - athena_network
    depends_on:
      - backend
      - frontend

  cloudflared:
    image: cloudflare/cloudflared:latest
    container_name: athena_cloudflared
    restart: always
    command: tunnel --no-autoupdate --url http://caddy:80
    networks:
      - athena_network
    depends_on:
      - caddy

  postgres:
    image: postgres:16-alpine
    container_name: athena_postgres
    restart: always
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-athena}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-athena_secure_password}
      POSTGRES_DB: ${POSTGRES_DB:-athena_db}
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    networks:
      - athena_network

  qdrant:
    image: qdrant/qdrant:latest
    container_name: athena_qdrant
    restart: always
    ports:
      - "6333:6333"
      - "6334:6334"
    volumes:
      - qdrant_data:/qdrant/storage
    networks:
      - athena_network

  redis:
    image: redis:alpine
    container_name: athena_redis
    restart: always
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    networks:
      - athena_network

  prometheus:
    image: prom/prometheus:latest
    container_name: athena_prometheus
    restart: always
    ports:
      - "9091:9090"
    volumes:
      - ./prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro
    networks:
      - athena_network

  grafana:
    image: grafana/grafana:latest
    container_name: athena_grafana
    restart: always
    ports:
      - "3002:3000"
    environment:
      - GF_SECURITY_ADMIN_PASSWORD=admin
    volumes:
      - ./grafana/provisioning:/etc/grafana/provisioning:ro
      - ./grafana/dashboards:/var/lib/grafana/dashboards:ro
    networks:
      - athena_network
    depends_on:
      - prometheus

networks:
  athena_network:
    driver: bridge

volumes:
  postgres_data:
  qdrant_data:
  redis_data:
  chroma_data:
  caddy_data:
  caddy_config:
