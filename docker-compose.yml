version: '3.8'

services:
  backend:
    build: 
      context: .
      dockerfile: Dockerfile
    container_name: athena_backend
    restart: always
    environment:
      - REDIS_URL=redis://redis:6379
      # Add other DB vars here as needed
    networks:
      - athena_network
    depends_on:
      - redis

  worker:
    build: 
      context: .
      dockerfile: Dockerfile
    container_name: athena_worker
    restart: always
    environment:
      - REDIS_URL=redis://redis:6379
    command: celery -A app.core.celery_app worker --loglevel=info
    networks:
      - athena_network
    depends_on:
      - redis

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: athena_frontend
    restart: always
    networks:
      - athena_network

  gateway:
    image: nginx:alpine
    container_name: athena_gateway
    restart: always
    ports:
      - "80:80"
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf:ro
    networks:
      - athena_network
    depends_on:
      - backend
      - frontend

  redis:
    image: redis:alpine
    container_name: athena_redis
    restart: always
    ports:
      - "6379:6379"
    networks:
      - athena_network

networks:
  athena_network:
    driver: bridge
