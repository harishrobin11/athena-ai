version: '3.8'

services:
  backend:
    build: 
      context: .
      dockerfile: Dockerfile
    container_name: athena_backend
    restart: always
    env_file:
      - .env
    environment:
      - REDIS_URL=redis://redis:6379
      - ANONYMIZED_TELEMETRY=false
      - CHROMA_SERVER_NOFILE=65535
      # Add other DB vars here as needed
    networks:
      - athena_network
    depends_on:
      - redis

  worker:
    build: 
      context: .
      dockerfile: Dockerfile
    container_name: athena_worker
    restart: always
    env_file:
      - .env
    environment:
      - REDIS_URL=redis://redis:6379
    command: celery -A app.core.celery_app worker --loglevel=info
    networks:
      - athena_network
    depends_on:
      - redis

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: athena_frontend
    restart: always
    networks:
      - athena_network

  gateway:
    image: nginx:alpine
    container_name: athena_gateway
    restart: always
    ports:
      - "80:80"
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf:ro
    networks:
      - athena_network
    depends_on:
      - backend
      - frontend

  redis:
    image: redis:alpine
    container_name: athena_redis
    restart: always
    ports:
      - "6379:6379"
    networks:
      - athena_network

  prometheus:
    image: prom/prometheus:latest
    container_name: athena_prometheus
    restart: always
    ports:
      - "9090:9090"
    volumes:
      - ./prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro
    networks:
      - athena_network

  grafana:
    image: grafana/grafana:latest
    container_name: athena_grafana
    restart: always
    ports:
      - "3001:3000"
    environment:
      - GF_SECURITY_ADMIN_PASSWORD=admin
    volumes:
      - ./grafana/provisioning:/etc/grafana/provisioning:ro
      - ./grafana/dashboards:/var/lib/grafana/dashboards:ro
    networks:
      - athena_network
    depends_on:
      - prometheus

networks:
  athena_network:
    driver: bridge
