apiVersion: apps/v1
kind: Deployment
metadata:
  name: athena-backend
  labels:
    app: athena-backend
spec:
  replicas: 2
  selector:
    matchLabels:
      app: athena-backend
  template:
    metadata:
      labels:
        app: athena-backend
    spec:
      containers:
      - name: athena-backend
        image: athena-backend:latest
        imagePullPolicy: IfNotPresent
        ports:
        - containerPort: 8000
        env:
        - name: DATABASE_URL
          valueFrom:
            secretKeyRef:
              name: athena-secrets
              key: database-url
        - name: OPENAI_API_KEY
          valueFrom:
            secretKeyRef:
              name: athena-secrets
              key: openai-api-key
        resources:
          requests:
            memory: "512Mi"
            cpu: "250m"
          limits:
            memory: "1Gi"
            cpu: "500m"
        readinessProbe:
          httpGet:
            path: /
            port: 8000
          initialDelaySeconds: 5
          periodSeconds: 10
