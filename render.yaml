services:
  # 1. FastAPI Backend Web Service
  - type: web
    name: athena-backend
    env: docker
    dockerfilePath: Dockerfile
    plan: free
    envVars:
      - key: REDIS_URL
        fromService:
          name: athena-redis
          type: redis
          property: connectionString
      - key: DATABASE_URL
        fromDatabase:
          name: athena-db
          property: connectionString
      - key: OPENAI_API_KEY
        sync: false
      - key: GEMINI_API_KEY
        sync: false
      - key: TARGET_LLM_MODEL
        value: gpt-4o-mini

  # 2. React Frontend Static Site
  - type: web
    name: athena-frontend
    runtime: static
    buildCommand: cd frontend && npm install --legacy-peer-deps && npm run build
    staticPublishPath: frontend/dist
    routes:
      - type: rewrite
        source: /api/*
        destination: https://athena-backend.onrender.com/api/*
      - type: rewrite
        source: /*
        destination: /index.html

  # 3. Managed Redis Cache
  - type: redis
    name: athena-redis
    plan: free
    ipAllowList: []

# 4. Managed PostgreSQL Database
databases:
  - name: athena-db
    plan: free
