name: Continuous Integration

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

jobs:
  test:
    name: Run Syntax and Core Tests
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Verify Backend Syntax (Dry-Run)
        run: |
          python -c "import app.main; print('Backend syntax check passed')"

      - name: Verify Frontend Syntax (Dry-Run)
        run: |
          python -c "import app.ui.main; print('Frontend syntax check passed')"
