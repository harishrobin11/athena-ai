name: Athena AI CI/CD Pipeline

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  test-and-build:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v4

    - name: Set up Python 3.11
      uses: actions/setup-python@v5
      with:
        python-version: '3.11'

    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install pytest pytest-asyncio httpx
        pip install --extra-index-url https://download.pytorch.org/whl/cpu torch==2.2.2+cpu
        pip install -r requirements.txt

    - name: Run Tests
      env:
        SECRET_KEY: "ci-secret-key-testing-12345"
        OPENAI_API_KEY: "ci-openai-api-key-testing"
      run: |
        pytest tests/ -v

    - name: Build Docker Image
      run: |
        docker build -t athena-ai-backend:${{ github.sha }} .

    - name: Run Trivy Vulnerability Scanner
      uses: aquasecurity/trivy-action@master
      with:
        image-ref: 'athena-ai-backend:${{ github.sha }}'
        format: 'table'
        exit-code: '0'
        ignore-unfixed: true
        vuln-type: 'os,library'
        severity: 'CRITICAL,HIGH'

    - name: Push to Registry (Mock)
      run: |
        echo "Pushing athena-ai-backend:${{ github.sha }} to container registry..."
